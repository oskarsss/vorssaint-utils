name: Notch gap screenshots
on:
  push:
    branches: [chore/notch-gap-screenshots]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture production geometry on a bright background
        run: ./build.sh --test-suite=notch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notch-gap-screenshots
          path: build/notch-gap-screenshots/*.png
          if-no-files-found: error
